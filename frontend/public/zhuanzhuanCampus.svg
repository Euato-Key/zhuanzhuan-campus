<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 5 280 145" width="280" height="145">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2E7D32" flood-opacity="0.25"/>
    </filter>

    <marker id="arrowGreen" viewBox="-10 -10 20 20" refX="2" refY="0" markerWidth="2" markerHeight="2" markerUnits="strokeWidth" orient="auto">
      <path d="M-6,-8 L10,0 L-6,8 Z" fill="#4CAF50"/>
    </marker>
    <marker id="arrowDarkGreen" viewBox="-10 -10 20 20" refX="2" refY="0" markerWidth="2" markerHeight="2" markerUnits="strokeWidth" orient="auto">
      <path d="M-6,-8 L10,0 L-6,8 Z" fill="#2E7D32"/>
    </marker>
  </defs>

  <!-- ========== 图形标志 ========== -->
  <g transform="translate(10, 10)">
    <!-- 外圈圆环 — 循环、环保、校园 -->
    <circle cx="60" cy="60" r="54" fill="none" stroke="url(#mainGrad)" stroke-width="4" opacity="0.2"/>
    <circle cx="60" cy="60" r="50" fill="none" stroke="url(#mainGrad)" stroke-width="3"/>

    <!-- 双向循环箭头 — "转转"交易循环 -->
    <g transform="translate(60, 60)" filter="url(#softShadow)">
      <path d="M0,-28 A28,28 0 0,1 24.2,-14" fill="none" stroke="#4CAF50" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
      <path d="M0,28 A28,28 0 0,1 -24.2,14" fill="none" stroke="#2E7D32" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowDarkGreen)"/>
    </g>

    <!-- 中心叶子 — 自然、清新、校园生机 -->
    <g transform="translate(60, 58)" filter="url(#softShadow)">
      <path d="M0,0 C-6,-12 -18,-20 -18,-26 C-18,-32 -14,-36 -8,-36 C0,-36 0,-24 0,-24 C0,-24 0,-36 8,-36 C14,-36 18,-32 18,-26 C18,-20 6,-12 0,0Z" fill="url(#leafGrad)"/>
      <line x1="0" y1="0" x2="0" y2="-30" stroke="#E8F5E9" stroke-width="1.5" opacity="0.6"/>
      <line x1="0" y1="-16" x2="-8" y2="-24" stroke="#E8F5E9" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="-16" x2="8" y2="-24" stroke="#E8F5E9" stroke-width="1" opacity="0.5"/>
    </g>

    <!-- 认证对勾 — 诚信、安全 -->
    <g transform="translate(96, 30)">
      <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#4CAF50" stroke-width="2.5"/>
      <path d="M-6,0 L-2,5 L7,-5" fill="none" stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ========== 文字标志 ========== -->
  <g transform="translate(130, 30)">
    <text x="0" y="38" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="36" font-weight="700" fill="#2E7D32" letter-spacing="4">转转</text>
    <text x="0" y="66" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#4CAF50" letter-spacing="6">校园二手</text>
    <line x1="0" y1="76" x2="90" y2="76" stroke="#81C784" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="98" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#9E9E9E" letter-spacing="2">让闲置流转 · 让青春延续</text>
  </g>
</svg>